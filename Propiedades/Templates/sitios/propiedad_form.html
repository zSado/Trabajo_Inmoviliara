{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2>{{ accion }} Propiedad</h2>
      <form method="post" class="card shadow-sm p-4">
        {% csrf_token %}
        {{ form.as_p }}
        

        <div class="mb-3 text-muted" style="margin-top: -15px; font-size: 0.9em;">
          ¿No aparece el tipo que buscas? 
          <a href="{% url 'crear_tipo' %}" target="_blank">Haz clic aquí para crear uno nuevo</a> 
          (se abrirá en otra pestaña).
        </div>

        <button type="submit" class="btn btn-primary mt-3">Guardar</button>
        <a href="{% url 'mis_propiedades' %}" class="btn btn-secondary mt-3">Cancelar</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}

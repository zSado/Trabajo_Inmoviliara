{% extends "base.html" %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Cambiar Contraseña</h2>
      <form method="post" class="card shadow-sm p-4 mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning mt-3">Actualizar Contraseña</button>
        <a href="{% url 'cuenta' %}" class="btn btn-secondary mt-3">Cancelar</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}

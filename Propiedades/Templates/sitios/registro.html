{% extends "base.html" %}
{% block title %}Registrarse{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Crear Cuenta</h2>
      <form method="post" class="card shadow-sm p-4 mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Registrarme</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Mis Propiedades</h2>
    <a href="{% url 'crear_propiedad' %}" class="btn btn-success">+ Nueva Propiedad</a>
  </div>
  <div class="list-group shadow-sm">
    {% for p in propiedades %}
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">{{ p.titulo }}</h5>
          <small class="text-muted">{{ p.estado|capfirst }} · ${{ p.precio }}</small>
        </div>
        <div>
          <a href="{% url 'editar_propiedad' p.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
          <a href="{% url 'eliminar_propiedad' p.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
        </div>
      </div>
    {% empty %}<p class="p-3">Aún no has publicado propiedades.</p>{% endfor %}
  </div>
</section>
{% endblock %}
